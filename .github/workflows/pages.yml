# Her push'ta uygulamayı derleyip GitHub Pages'te yayınlar.
# Site, hangi daldan olursa olsun EN SON push edilen sürümü gösterir
# (tek geliştiricili depo için pratik bir tercih).
name: GitHub Pages yayını

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; yenisi gelince eskisi iptal edilir
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle
        run: node build.js
      - name: Pages'i yapılandır (gerekirse etkinleştir)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
