<title>Hicri</title>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="star" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <g fill="none" stroke="#cda85c" stroke-width="1.2">
          <rect x="5" y="5" width="14" height="14" />
          <rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)" />
        </g>
      </svg>
      Hicri
    </div>
    <div class="city-wrap">
      <select id="city-select" aria-label="Şehir seçimi"></select>
    </div>
  </header>

  <main class="pages">
    <!-- ANA SAYFA -->
    <section class="page active" id="page-home">
      <section class="date-block">
        <div class="gregorian" id="gregorian-date"></div>
        <h1 class="hijri" id="hijri-date"></h1>
        <div class="divider" aria-hidden="true">
          <svg class="star" width="14" height="14" viewBox="0 0 24 24">
            <g fill="none" stroke="#cda85c" stroke-width="1.4">
              <rect x="6" y="6" width="12" height="12" />
              <rect x="6" y="6" width="12" height="12" transform="rotate(45 12 12)" />
            </g>
          </svg>
        </div>
      </section>

      <section class="countdown-card">
        <div class="next-name" id="next-name"></div>
        <div class="countdown" id="countdown">--:--:--</div>
        <div class="next-time" id="next-time"></div>
      </section>

      <section>
        <h2 class="section-title">Bugünün Vakitleri</h2>
        <div class="bosluk"></div>
        <div class="times" id="times"></div>
      </section>

      <section class="daily-card" id="daily-card">
        <div class="daily-tur" id="daily-tur"></div>
        <p class="daily-metin" id="daily-metin"></p>
        <div class="daily-kaynak" id="daily-kaynak"></div>
      </section>

      <section>
        <h2 class="section-title">Dini Günler</h2>
        <div class="bosluk"></div>
        <ul class="days-list" id="days-list"></ul>
      </section>

      <p class="footnote">
        Vakitler cihaz üzerinde astronomik hesapla üretilir; Diyanet takvimiyle
        birkaç dakikalık fark olabilir. Hicri tarihlerde 1 günlük fark görülebilir.
      </p>
    </section>

    <!-- TAKVİM -->
    <section class="page" id="page-takvim">
      <h2 class="section-title">Takvim</h2>
      <div class="bosluk"></div>
      <div id="takvim-root"></div>
    </section>

    <!-- KIBLE -->
    <section class="page" id="page-kible">
      <h2 class="section-title">Kıble</h2>
      <div class="bosluk"></div>
      <div id="kible-root" class="kb-kap"></div>
    </section>

    <!-- ZİKİRMATİK -->
    <section class="page" id="page-zikir">
      <h2 class="section-title">Zikirmatik</h2>
      <div class="bosluk"></div>
      <div id="zikir-root"></div>
    </section>

    <!-- ÖĞREN -->
    <section class="page" id="page-ogren">
      <h2 class="section-title">Öğren</h2>
      <div class="bosluk"></div>
      <div id="ogren-root"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Ana gezinme">
    <button class="tab active" data-page="home" aria-label="Ana Sayfa">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z" /></svg>
      <span>Ana Sayfa</span>
    </button>
    <button class="tab" data-page="takvim" aria-label="Takvim">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="5" width="16" height="15" rx="1" />
        <path d="M4 9 H20 M8 3 V6 M16 3 V6" />
      </svg>
      <span>Takvim</span>
    </button>
    <button class="tab" data-page="kible" aria-label="Kıble">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M15 9 L13 13 L9 15 L11 11 Z" />
      </svg>
      <span>Kıble</span>
    </button>
    <button class="tab" data-page="zikir" aria-label="Zikirmatik">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="1.7" /><circle cx="6.5" cy="8" r="1.7" /><circle cx="17.5" cy="8" r="1.7" />
        <circle cx="5" cy="13.5" r="1.7" /><circle cx="19" cy="13.5" r="1.7" />
        <circle cx="8" cy="18" r="1.7" /><circle cx="16" cy="18" r="1.7" /><circle cx="12" cy="20" r="1.7" />
      </svg>
      <span>Zikir</span>
    </button>
    <button class="tab" data-page="ogren" aria-label="Öğren">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5 C10 3.5 7 3.5 4 4.5 V19 C7 18 10 18 12 19.5 C14 18 17 18 20 19 V4.5 C17 3.5 14 3.5 12 5 Z M12 5 V19.5" />
      </svg>
      <span>Öğren</span>
    </button>
  </nav>
</div>
